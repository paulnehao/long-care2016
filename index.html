<head>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #fcf9f2;

            color: #756d63;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;
        }


        /* =========================================
           頁面標題
        ========================================= */

        .page-title {
            font-size: 26px;
            font-weight: 700;

            color: #625b53;

            margin-bottom: 6px;
        }

        .page-description {
            font-size: 15px;
            color: #968c81;

            margin-bottom: 22px;
        }


        /* =========================================
           每一個大區塊
        ========================================= */

        .record-section {

            background: #fffdf8;

            border: 1px solid #e5ded2;
            border-radius: 22px;

            padding: 20px;

            margin-bottom: 18px;
        }


        /* =========================================
           區塊標題
        ========================================= */

        .section-header {

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 16px;
        }

        .section-title {

            font-size: 20px;
            font-weight: 700;

            color: #6c6359;
        }


        /* =========================================
           三欄
        ========================================= */

        .three-columns {

            display: grid;

            grid-template-columns:
                minmax(180px, 1fr)
                minmax(180px, 1fr)
                minmax(300px, 2fr);

            gap: 14px;
        }


        /* =========================================
           三個欄位的外框
        ========================================= */

        .column {

            background: #f9f3e9;

            border-radius: 17px;

            padding: 14px;

            min-height: 220px;
        }


        .column-title {

            font-size: 15px;
            font-weight: 700;

            color: #756c62;

            margin-bottom: 12px;
        }


        /* =========================================
           左邊：勾選條件
        ========================================= */

        .condition-list {

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .condition {

            display: flex;
            align-items: center;

            min-height: 42px;

            padding: 8px 11px;

            border-radius: 11px;

            background: #f1e8db;

            cursor: pointer;

            font-size: 14px;

            transition: 0.15s;
        }

        .condition:hover {

            background: #e9ddcd;
        }


        .condition input {

            appearance: none;
            -webkit-appearance: none;

            width: 18px;
            height: 18px;

            margin: 0 9px 0 0;

            flex-shrink: 0;

            background: #fffefa;

            border: 1.5px solid #aaa096;

            border-radius: 4px;

            position: relative;

            cursor: pointer;
        }


        .condition input:checked {

            background: #aa9b88;

            border-color: #aa9b88;
        }


        .condition input:checked::after {

            content: "✓";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -52%);

            color: white;

            font-size: 13px;
            font-weight: bold;
        }


        /* =========================================
           中間：快速詞庫
        ========================================= */

        .phrase-list {

            display: flex;
            flex-direction: column;

            gap: 8px;
        }


        .phrase-btn {

            width: 100%;

            border: none;

            border-radius: 11px;

            padding: 10px 12px;

            background: #eee4d5;

            color: #71685e;

            font-size: 14px;

            text-align: left;

            cursor: pointer;

            transition: 0.15s;
        }


        .phrase-btn:hover {

            background: #e3d6c5;

            transform: translateX(2px);
        }


        .phrase-btn:active {

            transform: scale(0.98);
        }


        /* =========================================
           右邊：生成區
        ========================================= */

        .result-column {

            display: flex;
            flex-direction: column;
        }


        .result-text {

            width: 100%;

            flex: 1;

            min-height: 150px;

            resize: vertical;

            border: 1px solid #ddd2c4;

            border-radius: 13px;

            padding: 12px;

            background: #fffefa;

            color: #655d55;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            font-size: 14px;

            line-height: 1.7;

            outline: none;
        }


        .result-text:focus {

            border-color: #b8aa97;

            box-shadow:
                0 0 0 2px
                rgba(184, 170, 151, 0.15);
        }


        /* =========================================
           區塊按鈕
        ========================================= */

        .section-buttons {

            display: flex;

            justify-content: flex-end;

            gap: 8px;

            margin-top: 12px;
        }


        .section-btn {

            border: none;

            border-radius: 10px;

            padding: 8px 14px;

            background: #eee5d8;

            color: #685f56;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .section-btn:hover {

            background: #e3d7c8;
        }


        .copy-btn {

            background: #dfd2c1;
        }


        /* =========================================
           最下方
        ========================================= */

        .bottom-area {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

            padding-bottom: 40px;
        }


        .bottom-btn {

            border: none;

            border-radius: 13px;

            padding: 12px 20px;

            background: #eee5d8;

            color: #625a52;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        .bottom-btn:hover {

            background: #e2d6c7;
        }


        /* =========================================
           RWD
        ========================================= */

        @media (max-width: 1000px) {

            .three-columns {

                grid-template-columns:
                    1fr 1fr;
            }

            .result-column {

                grid-column: 1 / -1;
            }
        }


        @media (max-width: 650px) {

            body {
                padding: 12px;
            }

            .three-columns {

                grid-template-columns: 1fr;
            }

            .result-column {

                grid-column: auto;
            }

            .record-section {

                padding: 14px;
            }

            .section-title {

                font-size: 18px;
            }
        }

    </style>

        >

        </button>

    <script>


        /* =========================================
           所有區塊
        ========================================= */

        const sections = [

            "physical",
            "mental",
            "service",
            "professional",
            "caregiver",
            "safety",
            "resources"

        ];



        /* =========================================
           左側勾選條件
           
           勾選後：
           → 自動重新整理右側文字
        ========================================= */

        document
            .querySelectorAll(".condition input")
            .forEach(function (checkbox) {

                checkbox.addEventListener(
                    "change",
                    function () {

                        generateSection(
                            checkbox.dataset.section
                        );

                        saveData();

                    }
                );

            });



        /* =========================================
           產生單一區塊文字
        ========================================= */

        function generateSection(sectionName) {

            const checkboxes =
                document.querySelectorAll(
                    `.condition input[data-section="${sectionName}"]`
                );


            const texts = [];


            checkboxes.forEach(function (checkbox) {

                if (checkbox.checked) {

                    texts.push(
                        checkbox.dataset.text
                    );

                }

            });


            const textarea =
                document.getElementById(
                    "result-" + sectionName
                );


            /*
             * 注意：
             *
             * 如果右邊已經有快速詞庫內容，
             * 不直接覆蓋。
             *
             * 這裡只處理由 checkbox
             * 自動生成的部分。
             */

            const manualText =
                textarea.dataset.manualText || "";


            const autoText =
                texts.join("\n");


            if (manualText && autoText) {

                textarea.value =
                    manualText +
                    "\n" +
                    autoText;

            }
            else {

                textarea.value =
                    manualText ||
                    autoText;

            }

        }



        /* =========================================
           中間快速詞庫
        ========================================= */

        document
            .querySelectorAll(".phrase-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const section =
                            button.dataset.target;

                        const text =
                            button.dataset.text;

                        const textarea =
                            document.getElementById(
                                "result-" + section
                            );


                        /*
                         * 把快速詞庫文字加入
                         * manualText
                         */

                        let manualText =
                            textarea.dataset.manualText || "";


                        if (manualText.trim() !== "") {

                            manualText += "\n";

                        }


                        manualText += text;


                        textarea.dataset.manualText =
                            manualText;


                        generateSection(section);

                        saveData();

                    }
                );

            });



        /* =========================================
           直接修改右側文字時
        ========================================= */

        document
            .querySelectorAll(".result-text")
            .forEach(function (textarea) {

                textarea.addEventListener(
                    "input",
                    function () {

                        /*
                         * 使用者手動修改後，
                         * 將目前內容視為自訂內容。
                         */

                        textarea.dataset.manualText =
                            textarea.value;

                        saveData();

                    }
                );

            });



        /* =========================================
           複製單一區塊
        ========================================= */

        function copySection(sectionName) {

            const textarea =
                document.getElementById(
                    "result-" + sectionName
                );


            const title =
                document
                    .querySelector(
                        `[data-section-title="${sectionName}"]`
                    );


            const text =
                textarea.value.trim();


            if (!text) {

                alert("這個區塊目前沒有內容。");

                return;
            }


            navigator.clipboard
                .writeText(text)
                .then(function () {

                    alert("已複製本區塊！");

                });

        }



        /* =========================================
           清空單一區塊
        ========================================= */

        function clearSection(sectionName) {

            const textarea =
                document.getElementById(
                    "result-" + sectionName
                );


            textarea.value = "";

            textarea.dataset.manualText = "";


            /*
             * 同時取消左側 checkbox
             */

            document
                .querySelectorAll(
                    `.condition input[data-section="${sectionName}"]`
                )
                .forEach(function (checkbox) {

                    checkbox.checked = false;

                });


            saveData();

        }



        /* =========================================
           複製全部
        ========================================= */

        function copyAll() {

            const titleMap = {

                physical: "一、個案體況追蹤",

                mental: "二、認知情緒",

                service: "三、服務使用狀況",

                professional: "四、專業服務追蹤",

                caregiver: "五、照顧者狀況",

                safety: "六、安全風險",

                resources: "七、資源需求"

            };


            let allText = "";


            sections.forEach(function (sectionName) {

                const text =
                    document
                        .getElementById(
                            "result-" + sectionName
                        )
                        .value
                        .trim();


                if (text) {

                    allText +=
                        titleMap[sectionName] +
                        "\n" +
                        text +
                        "\n\n";

                }

            });


            if (!allText.trim()) {

                alert("目前沒有任何電訪紀錄。");

                return;
            }


            navigator.clipboard
                .writeText(allText.trim())
                .then(function () {

                    alert("已複製全部電訪紀錄！");

                });

        }



        /* =========================================
           清空全部
        ========================================= */

        function clearAll() {

            if (
                !confirm(
                    "確定要清空所有電訪紀錄嗎？"
                )
            ) {

                return;

            }


            sections.forEach(function (sectionName) {

                clearSection(sectionName);

            });


            localStorage.removeItem(
                "kaohsiungPhoneRecord"
            );

        }



        /* =========================================
           儲存
        ========================================= */

        function saveData() {

            const data = {};


            sections.forEach(function (sectionName) {

                const textarea =
                    document.getElementById(
                        "result-" + sectionName
                    );


                data[sectionName] = {

                    text: textarea.value,

                    manualText:
                        textarea.dataset.manualText || ""

                };

            });


            localStorage.setItem(

                "kaohsiungPhoneRecord",

                JSON.stringify(data)

            );

        }



        /* =========================================
           載入
        ========================================= */

        function loadData() {

            const saved =
                localStorage.getItem(
                    "kaohsiungPhoneRecord"
                );


            if (!saved) {

                return;

            }


            try {

                const data =
                    JSON.parse(saved);


                sections.forEach(
                    function (sectionName) {

                        const textarea =
                            document.getElementById(
                                "result-" + sectionName
                            );


                        if (
                            data[sectionName]
                        ) {

                            textarea.value =
                                data[sectionName].text || "";


                            textarea.dataset.manualText =
                                data[sectionName].manualText || "";

                        }

                    }
                );

            }
            catch (error) {

                console.log(
                    "讀取儲存資料失敗",
                    error
                );

            }

        }



        /* =========================================
           啟動
        ========================================= */

        loadData();

    </script>
